general {
  ignore_dbus_inhibit = true
  lock_cmd = pidof hyprlock || hyprlock --grace 2 
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  
}

listener {
  timeout = 285
  on-timeout = notify-send "system going to idle in 25 seconds"
}

listener {
  timeout = 300
  on-timeout = nmcli device disconnect wlan0
  # on-resume = nmcli device connect wlan0
}

listener {
  timeout = 305
  on-timeout = pidof hyprlock || hyprlock --grace 2
  on-resume = notify-send "welcome back"
}
